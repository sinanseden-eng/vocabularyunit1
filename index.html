<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 1 Vocabulary Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .vocab-card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .vocab-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }
        .gemini-output {
            transition: max-height 0.5s ease-in-out;
            max-height: 0;
            overflow: hidden;
        }
        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100">

    <div class="container mx-auto p-4 sm:p-6 md:p-8">
        <header class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900">Unit 1 Vocabulary Showcase</h1>
            <p class="mt-3 text-lg text-gray-600">A visual guide to the key words in "How Music Shapes Our Lives". Try the interactive features on each card!</p>
        </header>

        <!-- Music Section -->
        <section class="mb-12">
            <h2 class="text-3xl font-bold border-b-4 border-blue-500 pb-2 mb-6">Music</h2>
            <div id="music-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Cards will be injected by JavaScript -->
            </div>
        </section>

        <!-- Abstract Nouns Section -->
        <section class="mb-12">
            <h2 class="text-3xl font-bold border-b-4 border-green-500 pb-2 mb-6">Abstract Nouns</h2>
            <div id="abstract-nouns-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Cards will be injected by JavaScript -->
            </div>
        </section>

        <!-- Adjectives to Describe Sounds Section -->
        <section>
            <h2 class="text-3xl font-bold border-b-4 border-purple-500 pb-2 mb-6">Adjectives to Describe Sounds</h2>
            <div id="adjectives-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Cards will be injected by JavaScript -->
            </div>
        </section>

    </div>

    <script>
        const vocabData = {
            music: [
                { word: 'beat', definition: 'The regular rhythm or pulse in music', imageUrl: 'https://images.pexels.com/photos/164821/pexels-photo-164821.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'genre', definition: 'A category or style of music', imageUrl: 'https://images.pexels.com/photos/1587927/pexels-photo-1587927.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'hit', definition: 'A very popular song', imageUrl: 'https://images.pexels.com/photos/1190297/pexels-photo-1190297.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'lyric', definition: 'The words of a song', imageUrl: 'https://images.pexels.com/photos/210922/pexels-photo-210922.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'melody', definition: 'The main tune of a piece of music', imageUrl: 'https://images.pexels.com/photos/4709822/pexels-photo-4709822.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'pitch', definition: 'How high or low a sound is', imageUrl: 'https://images.pexels.com/photos/33597/violin-classical-music-instrument-classic.jpg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'playlist', definition: 'A custom collection of songs', imageUrl: 'https://images.pexels.com/photos/1763075/pexels-photo-1763075.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'rhythm', definition: 'A pattern of sounds and silences', imageUrl: 'https://images.pexels.com/photos/2253832/pexels-photo-2253832.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'soundtrack', definition: 'Music that accompanies a movie or show', imageUrl: 'https://images.pexels.com/photos/7991378/pexels-photo-7991378.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'tempo', definition: 'The speed of the beat in music', imageUrl: 'https://images.pexels.com/photos/3783385/pexels-photo-3783385.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'track', definition: 'A single song or piece of recorded music', imageUrl: 'https://images.pexels.com/photos/3944091/pexels-photo-3944091.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' }
            ],
            abstractNouns: [
                { word: 'beauty', definition: 'A quality that gives pleasure to the senses', imageUrl: 'https://images.pexels.com/photos/36717/amazing-animal-beautiful-beautifull.jpg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'creativity', definition: 'The ability to create new things', imageUrl: 'https://images.pexels.com/photos/3807755/pexels-photo-3807755.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'excitement', definition: 'A feeling of great enthusiasm', imageUrl: 'https://images.pexels.com/photos/2608517/pexels-photo-2608517.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'happiness', definition: 'The feeling of being happy; joy', imageUrl: 'https://images.pexels.com/photos/1556706/pexels-photo-1556706.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'harmony', definition: 'A pleasing combination of musical notes', imageUrl: 'https://images.pexels.com/photos/3756785/pexels-photo-3756785.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'inspiration', definition: 'Something that gives you creative ideas', imageUrl: 'https://prod-us-east-1-hd-cms-uploads.s3.amazonaws.com/cms_uploads/en_US/img/happifiers/inspiration-comes-from-1.jpg' },
                { word: 'love', definition: 'A very strong feeling of affection', imageUrl: 'https://images.pexels.com/photos/3171815/pexels-photo-3171815.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'sadness', definition: 'The feeling of being unhappy', imageUrl: 'https://images.pexels.com/photos/2387873/pexels-photo-2387873.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'the truth', definition: 'The real facts about a situation', imageUrl: 'https://images.pexels.com/photos/733853/pexels-photo-733853.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' }
            ],
            adjectives: [
                { word: 'confusing', definition: 'Difficult to understand', imageUrl: 'https://images.pexels.com/photos/3184328/pexels-photo-3184328.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'distracting', definition: 'Taking your attention away', imageUrl: 'https://images.pexels.com/photos/3769138/pexels-photo-3769138.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'energizing', definition: 'Making you feel full of energy', imageUrl: 'https://images.pexels.com/photos/3764014/pexels-photo-3764014.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'relaxing', definition: 'Making you feel calm and rested', imageUrl: 'https://images.pexels.com/photos/2249602/pexels-photo-2249602.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'soothing', definition: 'Gently calming and reducing worry', imageUrl: 'https://images.pexels.com/photos/4175066/pexels-photo-4175066.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'stimulating', definition: 'Making you feel more active and alert', imageUrl: 'https://images.pexels.com/photos/3184431/pexels-photo-3184431.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'stressful', definition: 'Causing feelings of worry or anxiety', imageUrl: 'https://images.pexels.com/photos/3136673/pexels-photo-3136673.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'tedious', definition: 'Very boring and lasting for a long time', imageUrl: 'https://images.pexels.com/photos/4348401/pexels-photo-4348401.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' },
                { word: 'upbeat', definition: 'Full of hope, happiness, and good feelings', imageUrl: 'https://images.pexels.com/photos/1509534/pexels-photo-1509534.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1' }
            ]
        };

        function createVocabCard(item) {
            const card = document.createElement('div');
            card.className = 'vocab-card bg-white rounded-lg shadow-md overflow-hidden flex flex-col';
            
            card.innerHTML = `
                <img src="${item.imageUrl}" alt="${item.word}" class="w-full h-40 object-cover" onerror="this.onerror=null;this.src='https://placehold.co/600x400/cccccc/ffffff?text=Image+Not+Found';">
                <div class="p-4 flex flex-col flex-grow">
                    <h3 class="text-xl font-bold">${item.word}</h3>
                    <p class="text-gray-600 mt-1">${item.definition}</p>
                    <button class="gemini-btn mt-4 w-full bg-purple-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-purple-700 transition-colors duration-200">
                        ✨ Explain & Example
                    </button>
                    <div class="gemini-output bg-purple-50 p-3 mt-3 rounded-lg">
                        <div class="loader-container" style="display: none;"><div class="loader"></div></div>
                        <div class="content-container text-sm text-gray-700"></div>
                    </div>
                    <div class="mt-4 pt-4 border-t border-gray-200 flex-grow flex flex-col">
                        <label class="font-semibold text-gray-700 mb-2">Practice with a sentence:</label>
                        <textarea class="sentence-input w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-400" rows="2" placeholder="Write your sentence here..."></textarea>
                        <button class="check-sentence-btn mt-2 w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-700 transition-colors duration-200">
                            Check My Sentence
                        </button>
                        <div class="feedback-output bg-blue-50 p-3 mt-3 rounded-lg" style="display: none;">
                            <div class="loader-container" style="display: none;"><div class="loader"></div></div>
                            <div class="content-container text-sm text-gray-700"></div>
                        </div>
                    </div>
                </div>
            `;
            return card;
        }

        function populateGrid(gridId, data) {
            const grid = document.getElementById(gridId);
            data.forEach(item => {
                grid.appendChild(createVocabCard(item));
            });
        }

        async function callGeminiWithExponentialBackoff(prompt, maxRetries = 5) {
            let delay = 1000;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const apiKey = "AIzaSyAuFtUiTGRQPMPlOXfcLr_tO--VQwLZwZE";
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;
                    const payload = { contents: [{ role: "user", parts: [{ text: prompt }] }] };

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        if (response.status === 429 || response.status >= 500) {
                            throw new Error(`API call failed with status: ${response.status}`);
                        } else {
                            const errorResult = await response.json();
                            return `Error: ${errorResult.error?.message || 'An unknown error occurred.'}`;
                        }
                    }

                    const result = await response.json();
                    if (result.candidates && result.candidates.length > 0 &&
                        result.candidates[0].content && result.candidates[0].content.parts &&
                        result.candidates[0].content.parts.length > 0) {
                        return result.candidates[0].content.parts[0].text;
                    } else {
                        return "Sorry, the model's response was empty.";
                    }
                } catch (error) {
                    if (i === maxRetries - 1) {
                        console.error("Gemini API call error after max retries:", error);
                        return "Sorry, an error occurred while trying to get a response. Please try again later.";
                    }
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            populateGrid('music-grid', vocabData.music);
            populateGrid('abstract-nouns-grid', vocabData.abstractNouns);
            populateGrid('adjectives-grid', vocabData.adjectives);

            document.addEventListener('click', async (e) => {
                if (e.target.classList.contains('gemini-btn')) {
                    const button = e.target;
                    const card = button.closest('.vocab-card');
                    const word = card.querySelector('h3').textContent;
                    const definition = card.querySelector('p').textContent;
                    const outputDiv = card.querySelector('.gemini-output');
                    const loader = outputDiv.querySelector('.loader-container');
                    const content = outputDiv.querySelector('.content-container');

                    button.disabled = true;
                    button.classList.add('opacity-50', 'cursor-not-allowed');
                    
                    loader.style.display = 'block';
                    content.innerHTML = '';
                    outputDiv.style.maxHeight = '50px';

                    const prompt = `For the vocabulary word "${word}", which means "${definition}", do two things and format it exactly like this:\n\n**New Example:** [Write one new, creative example sentence here.]\n\n**Simple Explanation:** [Explain the word in a very simple way, like you're talking to a 10-year-old, maybe with an analogy.]`;

                    const response = await callGeminiWithExponentialBackoff(prompt);
                    
                    content.innerHTML = response.replace(/\n/g, '<br>');
                    loader.style.display = 'none';
                    outputDiv.style.maxHeight = outputDiv.scrollHeight + 'px';

                    button.disabled = false;
                    button.classList.remove('opacity-50', 'cursor-not-allowed');
                }

                if (e.target.classList.contains('check-sentence-btn')) {
                    const button = e.target;
                    const card = button.closest('.vocab-card');
                    const word = card.querySelector('h3').textContent;
                    const definition = card.querySelector('p').textContent;
                    const textarea = card.querySelector('.sentence-input');
                    const studentSentence = textarea.value;
                    const outputDiv = card.querySelector('.feedback-output');
                    const loader = outputDiv.querySelector('.loader-container');
                    const content = outputDiv.querySelector('.content-container');

                    if (studentSentence.trim() === '') {
                        content.textContent = 'Please write a sentence first.';
                        outputDiv.style.display = 'block';
                        return;
                    }

                    button.disabled = true;
                    button.classList.add('opacity-50', 'cursor-not-allowed');
                    
                    loader.style.display = 'block';
                    content.innerHTML = '';
                    outputDiv.style.display = 'block';

                    const prompt = `You are a friendly and encouraging English teacher. A student is practicing the vocabulary word "${word}", which means "${definition}". The student wrote the following sentence: "${studentSentence}". Please do two things: 1. Tell the student if they used the word correctly or not. 2. If it's correct, praise them and explain why it's a good sentence. If it's incorrect, gently explain the mistake and provide a corrected version of their sentence. Keep your feedback concise and positive.`;
                    
                    const response = await callGeminiWithExponentialBackoff(prompt);
                    
                    content.innerHTML = response.replace(/\n/g, '<br>');
                    loader.style.display = 'none';

                    button.disabled = false;
                    button.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            });
        });
    </script>
</body>
</html>
